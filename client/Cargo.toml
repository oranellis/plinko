[package]
name = "plinko-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
futures-channel = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.7", features = ["http", "websocket"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
plinko = { path = "../server", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
wasm-bindgen = { version = "0.2", features = ["enable-interning"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasGradient", "CanvasRenderingContext2d", "DomRect", "Element", "HtmlButtonElement", "HtmlCanvasElement", "HtmlElement", "MouseEvent", "ResizeObserver",
    "PointerEvent", "TextMetrics", "WheelEvent", "Window", "Document", "MediaQueryList", "Navigator",
    "Location", "Storage",
] }
