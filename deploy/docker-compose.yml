services:
  plinko:
    # Use the pre-built image from ghcr.io by default.
    # Override with PLINKO_IMAGE to use a locally-built image:
    #   PLINKO_IMAGE=plinko:latest docker compose ...
    image: ${PLINKO_IMAGE:-ghcr.io/oranellis/plinko:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PLINKO_PORT=7892
      - PLINKO_WEB_DIST=/app/dist
      - XDG_DATA_HOME=/data
    volumes:
      - plinko-data:/data
    expose:
      - "7892"   # WebSocket  — internal only, proxied by nginx
      - "7893"   # Static server — internal only, proxied by nginx
    healthcheck:
      # Check the HTTP static server (7893) — a bare TCP connect causes no log
      # noise there, unlike the WebSocket port (7892) which logs handshake errors.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7893"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only $DOMAIN is substituted; nginx variables ($host etc.) are preserved.
      - NGINX_ENVSUBST_TEMPLATE_VARS=DOMAIN
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      plinko:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Attempt renewal every 12 h; Let's Encrypt only renews within 30 days of expiry.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  plinko-data:
    driver: local
  certbot-www:
    driver: local
