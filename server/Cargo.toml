[package]
name = "plinko"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "plinko-server"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# what only the server needs, the client builds without it
server = [
    "dep:argon2", "dep:axum", "dep:futures-util", "dep:rusqlite", "dep:serde_json", "dep:sha2",
    "dep:tokio", "dep:tower-http",
]

[dependencies]
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
nanoid = "0.5.0"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.24.1", features = ["v4", "serde", "fast-rng"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["rng-getrandom"] }

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.27"
tower = { version = "0.5", features = ["util"] }
