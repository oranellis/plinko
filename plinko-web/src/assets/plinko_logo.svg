  <title
     id="title1">Plinko board — 3-2-3 rows with ball between pegs 1 and 2</title>
  <desc
     id="desc1">A minimal plinko board with three rows of flat gray pegs in a 3-2-3 pattern and a shiny ball between the first and second peg of the top row.</desc>
