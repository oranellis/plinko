<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="400"
   height="400"
   viewBox="0 0 400 400"
   role="img"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Plinko board — 3-2-3 rows with shiny pegs</title>
  <desc>A minimal plinko board with three rows of shiny pegs in a 3-2-3 pattern.</desc>
  <defs>
    <radialGradient id="peg-shine" cx="35%" cy="28%" r="65%" fx="35%" fy="28%">
      <stop offset="0%"   stop-color="#e8ddd8" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#b8a8a0" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#7a6a64" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a3a36" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="peg-reflect" cx="62%" cy="70%" r="28%" fx="62%" fy="70%">
      <stop offset="0%"   stop-color="#c8b8b0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c8b8b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Row 1 pegs (y=70) -->
  <ellipse cx="70"  cy="70" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="70"  cy="70" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="70"  cy="55" rx="16" ry="9"  fill="white" opacity="0.22"/>

  <ellipse cx="200" cy="70" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="200" cy="70" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="200" cy="55" rx="16" ry="9"  fill="white" opacity="0.22"/>

  <ellipse cx="330" cy="70" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="330" cy="70" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="330" cy="55" rx="16" ry="9"  fill="white" opacity="0.22"/>

  <!-- Row 2 pegs (y=200) -->
  <ellipse cx="135" cy="200" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="135" cy="200" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="135" cy="185" rx="16" ry="9"  fill="white" opacity="0.22"/>

  <ellipse cx="265" cy="200" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="265" cy="200" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="265" cy="185" rx="16" ry="9"  fill="white" opacity="0.22"/>

  <!-- Row 3 pegs (y=330) -->
  <ellipse cx="70"  cy="330" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="70"  cy="330" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="70"  cy="315" rx="16" ry="9"  fill="white" opacity="0.22"/>

  <ellipse cx="200" cy="330" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="200" cy="330" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="200" cy="315" rx="16" ry="9"  fill="white" opacity="0.22"/>

  <ellipse cx="330" cy="330" rx="48" ry="48" fill="url(#peg-shine)"/>
  <ellipse cx="330" cy="330" rx="48" ry="48" fill="url(#peg-reflect)"/>
  <ellipse cx="330" cy="315" rx="16" ry="9"  fill="white" opacity="0.22"/>
</svg>
