[package]
name = "plinko"
version = "0.1.0"
edition = "2024"

[dependencies]
plinko-shared = { path = "../plinko-shared" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
chrono = { version = "0.4", features = ["serde"] }
